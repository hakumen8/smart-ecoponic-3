  <body>
    <div id="app">

            <span data-i18n="lang"></span>

          <button id="shortcutBtn" class="btn ghost keys-btn" type="button">

      </header>

      <main class="layout">
        <div id="panelResizer" class="panel-resizer" role="separator" aria-orientation="vertical" tabindex="0"></div>
        <section class="stage" id="stage">
          <div id="viewport" class="viewport">
            <div class="stage-info">

              <span id="modelStats" class="pill subtle"></span>
              <span id="complexity" class="pill complexity"></span>

            <div id="emptyState" class="empty hidden">
              <div class="empty-card">
                <div class="empty-icon" aria-hidden="true">✦</div>

              <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

            </div>
            <div class="dock" role="toolbar">
              <button class="tbtn emphasis" id="dockReset" type="button">
                <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z" fill="currentColor"/></svg>
                <span data-i18n="resetView"></span>
              </button>
              <div class="dock-export">
                <button class="tbtn" id="dockExport" type="button" aria-expanded="false" aria-controls="exportMenu">

                <div id="exportMenu" class="export-menu hidden">
                  <button type="button" id="menuGLB" data-i18n="downloadGLB"></button>
                  <button type="button" id="menuPNG" data-i18n="downloadPNG"></button>
                  <button type="button" id="menuPNGHD" data-i18n="pngHd"></button>
                  <button type="button" id="menuPNGAlpha" data-i18n="pngClear"></button>
                  <button type="button" id="menuOBJ" data-i18n="downloadOBJ"></button>
                </div>
              </div>
              <button class="tbtn" id="dockFull" type="button">
                <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span data-i18n="fullscreen"></span>
              </button>
            </div>
          </div>
          <div class="toolbar" role="toolbar">
            <div class="tool-group">
              <span class="group-kicker" data-i18n="groupCamera"></span>
              <div class="tool-row">
                <button class="tbtn emphasis" id="btnReset" type="button"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z" fill="currentColor"/></svg><span data-i18n="resetView"></span></button>

                <button class="tbtn toggle on" id="btnLabels" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M3 5h12l6 7-6 7H3Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span data-i18n="labels"></span></button>
                <button class="tbtn toggle on" id="btnGrid" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M3 3h18v18H3ZM3 9h18M3 15h18M9 3v18M15 3v18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="grid"></span></button>
                <button class="tbtn" id="btnFullscreen" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="fullscreen"></span></button>
              </div>
            </div>
            <div class="tool-group">
              <span class="group-kicker" data-i18n="flowView"></span>
              <div class="flow-switch" id="flowSwitch" role="group">
                <button type="button" id="btnFlowStatic" class="on" aria-pressed="true">

                  <span data-i18n="flowStatic"></span>
                </button>
                <button type="button" id="btnFlowLive" class="live" aria-pressed="false">
                  <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
                  <span data-i18n="flowLive"></span>
                </button>
              </div>
            </div>
            <div class="tool-group">
              <span class="group-kicker" data-i18n="groupExport"></span>
              <div class="tool-row">
                <button class="tbtn" id="btnGLB" type="button"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="downloadGLB"></span></button>
                <button class="tbtn" id="btnPNG" type="button"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 5h16v14H4Zm3 11 3.5-4.5 2.5 3 3.5-4.5L20 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-i18n="downloadPNG"></span></button>

        <aside id="studioPanel" class="panel">
          <button type="button" id="sheetGrip" class="sheet-grip" tabindex="-1"></button>
          <form id="promptForm" class="card">
            <div class="group-head">
              <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="m12 2 2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4Z" fill="currentColor"/></svg>
              <span class="group-kicker" data-i18n="groupGenerate"></span>
            </div>
            <label for="prompt" class="card-title" data-i18n="promptLabel"></label>
            <textarea id="prompt" rows="6" dir="auto" autocomplete="off" data-i18n-ph="promptPlaceholder"></textarea>
            <div id="suggestions" class="suggest" role="listbox" hidden></div>
            <div class="row">
              <button type="submit" class="btn primary grow" id="btnGenerate">
                <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="m12 2 2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4Z" fill="currentColor"/></svg>
                <span data-i18n="generate"></span>
              </button>
              <button type="button" class="btn secondary" id="btnClear">
                <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span data-i18n="clear"></span>
              </button>
            </div>
            <div class="row minor-row">
              <button type="button" class="btn secondary grow" id="btnImprove"><span data-i18n="improve"></span></button>
              <button type="button" class="btn ghost" id="btnShare"><span data-i18n="share"></span></button>
              <button type="button" class="btn ghost" id="btnFavorite"><span data-i18n="saveFavorite"></span></button>
            </div>
            <div class="api-box" id="apiBox">
              <button type="button" class="btn api" id="btnApi">
                <span data-i18n="apiGenerate"></span>
              </button>
              <p class="api-note" data-i18n="apiHint"></p>
              <div id="apiKeyForm">
                <label class="api-label" for="apiKeyInput" data-i18n="apiKeyLabel"></label>
                <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" data-i18n-ph="apiKeyPlaceholder" />
                <div class="row">
                  <button type="button" class="btn secondary grow" id="btnSaveKey"><span data-i18n="apiSaveKey"></span></button>
                  <button type="button" class="btn ghost" id="btnForgetKey"><span data-i18n="apiForgetKey"></span></button>
                </div>
                <ol class="api-steps">
                  <li data-i18n="apiStep1"></li>
                  <li data-i18n="apiStep2"></li>
                  <li data-i18n="apiStep3"></li>
                </ol>
                <a class="api-link" href="https://www.meshy.ai/developers/keys" target="_blank" rel="noopener noreferrer" data-i18n="apiKeyLink"></a>
              </div>
              <p id="apiKeySaved" class="api-saved hidden">
                <span data-i18n="apiKeyStored"></span>
                <button type="button" id="btnEditKey" class="btn ghost small"><span data-i18n="apiChangeKey"></span></button>
              </p>
              <details id="apiProxyDetails">
                <summary data-i18n="apiProxyLabel"></summary>
                <p class="api-note" data-i18n="apiProxyHint"></p>
                <input id="apiProxyInput" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://" />
              </details>
              <p id="apiFileLinkWrap" class="hidden"><a id="apiFileLink" target="_blank" rel="noopener noreferrer" data-i18n="apiOpenFile"></a></p>
            </div>
            <div class="history-wrap">
              <span class="mini-title" data-i18n="recent"></span>
              <div id="history" class="chips"></div>
            </div>
            <div class="examples">
              <span class="mini-title" data-i18n="examples"></span>
              <div id="examples" class="example-grid"></div>
            </div>
          </form>

          <section class="card">
            <h2 class="card-title" data-i18n="understood"></h2>
            <div id="understood" class="understood"></div>
          </section>

          <section class="card" id="editCard">
            <h2 class="card-title" data-i18n="editParts"></h2>
            <p class="mini-title" data-i18n="editHint"></p>
            <div class="add-shapes" role="group" id="addShapes">
              <span class="mini-title" data-i18n="addShape"></span>
              <div class="tool-row">
                <button type="button" class="btn small" id="addCube" data-i18n="addCube"></button>
                <button type="button" class="btn small" id="addSphere" data-i18n="addSphere"></button>
                <button type="button" class="btn small" id="addCylinder" data-i18n="addCylinder"></button>
                <button type="button" class="btn small" id="addCone" data-i18n="addCone"></button>
              </div>
            </div>
            <div id="partList" class="part-list"></div>
          </section>

          <section class="card">
            <div class="group-head">
              <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="7" r="1.7" fill="currentColor"/><circle cx="15" cy="12" r="1.7" fill="currentColor"/><circle cx="10" cy="17" r="1.7" fill="currentColor"/></svg>
              <h2 class="group-kicker" data-i18n="groupSettings"></h2>
            </div>
            <label class="field">
              <span data-i18n="background"></span>
              <input id="bgColor" type="color" value="#0b1020" />
            </label>
            <label class="field">
              <span data-i18n="lighting"></span>
              <select id="lightPreset"></select>
            </label>
            <label class="field">
              <span data-i18n="intensity"></span>
              <input id="lightIntensity" type="range" min="0.35" max="1.8" step="0.05" value="1" />
            </label>
            <label class="check">
              <input id="shadows" type="checkbox" checked />
              <span data-i18n="shadows"></span>
            </label>
            <div class="field quality-field">
              <span data-i18n="quality"></span>
              <div class="quality-switch" id="qualitySwitch" role="group">
                <button type="button" id="btnQualityHigh" data-i18n="qualityHigh"></button>
                <button type="button" id="btnQualityFast" data-i18n="qualityFast"></button>
              </div>
            </div>
          </section>

          <section class="card">
            <h2 class="card-title" data-i18n="favorites"></h2>
            <p class="mini-title" data-i18n="favoritesHint"></p>
            <div id="favorites" class="presets"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2 class="card-title" data-i18n="presets"></h2>
              <label class="btn ghost small file-btn">
                <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 21V10m0 0-4 4m4-4 4 4M4 7V4h16v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span data-i18n="loadFile"></span>
                <input type="file" id="fileInput" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden />
              </label>
            </div>
            <p class="mini-title" data-i18n="presetHint"></p>
            <div id="presets" class="presets"></div>
          </section>

          <footer class="foot" data-i18n="footer"></footer>
        </aside>
      </main>
      <div id="sheetScrim" class="sheet-scrim"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="shareSheet" class="modal hidden">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
          <h2 id="shareTitle" data-i18n="shareTitle"></h2>
          <p class="api-note" data-i18n="shareNote"></p>
          <input id="shareUrl" type="text" readonly />
          <div class="row">
            <button type="button" id="copyShare" class="btn primary grow"><span data-i18n="copyLink"></span></button>
            <button type="button" id="closeShare" class="btn" data-i18n="close"></button>
          </div>
        </div>
      </div>
      <div id="shortcuts" class="modal hidden">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="shortcutTitle">
          <h2 id="shortcutTitle" data-i18n="shortcuts"></h2>
          <ul id="shortcutList" class="shortcut-list"></ul>
          <button type="button" id="closeShortcuts" class="btn" data-i18n="close"></button>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Mujassam 3D Studio — free bilingual text-to-3D. Describe a model in Arabic or English and download GLB, OBJ, or PNG." />
    <title>Mujassam 3D Studio · استوديو مجسّم</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235ad1ff'/><stop offset='1' stop-color='%23a78bfa'/></linearGradient></defs><path d='M32 4 58 18v28L32 60 6 46V18Z' fill='url(%23g)'/><path d='M32 4v56M6 18l26 14 26-14' stroke='%230b1020' stroke-width='3' fill='none'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-BQ8cqEhI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DbzvFzfo.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar glass">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ad1ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><path d="M32 4 58 18v28L32 60 6 46V18Z" fill="url(#lg)"/><path d="M32 4v56M6 18l26 14 26-14" stroke="#0b1020" stroke-width="3" fill="none"/></svg>
          </div>
          <div>
            <h1 data-i18n="appName"></h1>
            <p class="tagline" data-i18n="tagline"></p>
          </div>
        </div>
        <div class="top-actions">
          <button id="langBtn" class="btn ghost" type="button">
            <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4a13.6 13.6 0 0 1 1.9 4h-3.8A13.6 13.6 0 0 1 12 4ZM4.3 14a8 8 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4Zm.8 2h3a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16Zm3-8h-3a8 8 0 0 1 4.4-3.6A15.7 15.7 0 0 0 8.1 8ZM12 20a13.6 13.6 0 0 1-1.9-4h3.8A13.6 13.6 0 0 1 12 20Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.6a15.7 15.7 0 0 0 1.4-3.6h3a8 8 0 0 1-4.4 3.6ZM16.3 14a16.5 16.5 0 0 0 0-4h3.4a8 8 0 0 1 0 4Z" fill="currentColor"/></svg>
            <span data-i18n="lang"></span>
          </button>
        </div>
      </header>

      <main class="layout">
        <section class="stage glass" id="stage">
          <div id="viewport" class="viewport"></div>
          <div class="stage-info">
            <span id="modelTitle" class="pill"></span>
            <span id="modelStats" class="pill subtle"></span>
          </div>
          <div id="emptyState" class="empty hidden">
            <div class="empty-icon" aria-hidden="true">✦</div>
            <h2 data-i18n="emptyTitle"></h2>
            <p data-i18n="emptyBody"></p>
          </div>
          <div id="loading" class="loading hidden" role="status" aria-live="polite">
            <div class="spinner"></div>
            <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
            <span id="progressLabel"></span>
          </div>
          <div class="toolbar glass" role="toolbar">
            <div class="flow-switch" id="flowSwitch" role="group">
              <span class="flow-kicker" data-i18n="flowView"></span>
              <button type="button" id="btnFlowStatic" class="on" aria-pressed="true"><span data-i18n="flowStatic"></span></button>
              <button type="button" id="btnFlowLive" class="live" aria-pressed="false"><span data-i18n="flowLive"></span></button>
            </div>
            <button class="tbtn" id="btnReset" type="button"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z" fill="currentColor"/></svg><span data-i18n="resetView"></span></button>
            <button class="tbtn toggle" id="btnRotate" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 6c-5.5 0-10 2.2-10 5 0 2.2 2.9 4.1 7 4.8V19l4-4-4-4v2.7C5.9 13.1 4 12 4 11c0-1.5 3.6-3 8-3s8 1.5 8 3c0 .7-1 1.6-3 2.2v2.1c2.9-.8 5-2.4 5-4.3 0-2.8-4.5-5-10-5Z" fill="currentColor"/></svg><span data-i18n="autoRotate"></span></button>
            <button class="tbtn toggle" id="btnWire" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7Zm0 2.3L18.7 8 12 11.7 5.3 8ZM5 9.7l6 3.3v6.7l-6-3.3Zm8 10V13l6-3.3v6.7Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="wireframe"></span></button>
            <button class="tbtn toggle on" id="btnLabels" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M3 5h12l6 7-6 7H3Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span data-i18n="labels"></span></button>
            <button class="tbtn toggle on" id="btnGrid" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M3 3h18v18H3ZM3 9h18M3 15h18M9 3v18M15 3v18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="grid"></span></button>
            <button class="tbtn" id="btnFullscreen" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="fullscreen"></span></button>
            <button class="tbtn primary" id="btnGLB" type="button"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="downloadGLB"></span></button>
            <button class="tbtn primary alt" id="btnPNG" type="button"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 5h16v14H4Zm3 11 3.5-4.5 2.5 3 3.5-4.5L20 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-i18n="downloadPNG"></span></button>
            <button class="tbtn primary obj" id="btnOBJ" type="button"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="downloadOBJ"></span></button>
          </div>
          <p class="hint" data-i18n="hint"></p>
        </section>

        <aside class="panel">
          <form id="promptForm" class="card glass">
            <label for="prompt" class="card-title" data-i18n="promptLabel"></label>
            <textarea id="prompt" rows="4" dir="auto" data-i18n-ph="promptPlaceholder"></textarea>
            <div class="row">
              <button type="submit" class="btn primary grow" id="btnGenerate">
                <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="m12 2 2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4Z" fill="currentColor"/></svg>
                <span data-i18n="generate"></span>
              </button>
              <button type="button" class="btn ghost" id="btnClear" data-i18n="clear"></button>
            </div>
            <div class="examples">
              <span class="mini-title" data-i18n="examples"></span>
              <div id="examples" class="chips"></div>
            </div>
          </form>

          <section class="card glass">
            <h3 class="card-title" data-i18n="understood"></h3>
            <div id="understood" class="understood"></div>
          </section>

          <section class="card glass">
            <h3 class="card-title" data-i18n="sceneSettings"></h3>
            <label class="field">
              <span data-i18n="background"></span>
              <input id="bgColor" type="color" value="#0b1020" />
            </label>
            <label class="field">
              <span data-i18n="lighting"></span>
              <select id="lightPreset"></select>
            </label>
            <label class="field">
              <span data-i18n="intensity"></span>
              <input id="lightIntensity" type="range" min="0.35" max="1.8" step="0.05" value="1" />
            </label>
            <label class="check">
              <input id="shadows" type="checkbox" checked />
              <span data-i18n="shadows"></span>
            </label>
          </section>

          <section class="card glass">
            <div class="card-head">
              <h3 class="card-title" data-i18n="presets"></h3>
              <label class="btn ghost small file-btn">
                <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 21V10m0 0-4 4m4-4 4 4M4 7V4h16v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span data-i18n="loadFile"></span>
                <input type="file" id="fileInput" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden />
              </label>
            </div>
            <p class="mini-title" data-i18n="presetHint"></p>
            <div id="presets" class="presets"></div>
          </section>

          <footer class="foot" data-i18n="footer"></footer>
        </aside>
      </main>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
